# Настройки Spring Boot. Все значения можно переопределить переменными
# окружения (синтаксис ${ENV:default}) - так работают docker-compose и прод.

spring:
  application:
    name: robomatch

  # --- База данных -------------------------------------------------------
  datasource:
    # Адрес PostgreSQL. Локально: docker compose up -d db (порт 5432).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/robomatch}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    # Пул соединений HikariCP: размер под одновременных пользователей
    # (50 пользователей; страница каталога = ~6 коротких
    # запросов). Переопределяется env при другом окружении.
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:15}
      # 8 с < 10 с таймаута BFF-запросов: при исчерпании пула backend
      # успевает ответить ошибкой ДО обрыва fetch на стороне Next.js
      # (иначе клиент видит безликий 502)
      connection-timeout: ${DB_POOL_TIMEOUT_MS:8000}

  # --- Flyway: версионные миграции ---------------------------------------
  # При старте применяет SQL-файлы из src/main/resources/db/migration
  # (V1__baseline_schema.sql - схема, V2__demo_data.sql - демо-данные).
  flyway:
    enabled: true
    locations: classpath:db/migration

  # --- JPA / Hibernate ---------------------------------------------------
  jpa:
    # validate = Hibernate СВЕРЯЕТ сущности со схемой, но НЕ создаёт/меняет её.
    # Схемой владеет Flyway - единственный источник DDL. Никогда не ставьте
    # update/create в команде: расползание схем у разных разработчиков.
    hibernate:
      ddl-auto: validate
    # Не держим EntityManager открытым на время рендера ответа -
    # заставляет думать о границах транзакций сразу.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # --- Загрузка файлов (импорт параметров) -------------------------------
  # Первый уровень лимита: servlet отклоняет слишком большой multipart
  # ДО контроллера (MaxUploadSizeExceededException -> 413). Второй,
  # точный - сервисная проверка в AttachmentStorage (app.upload.max-bytes).
  servlet:
    multipart:
      # Servlet-потолок multipart - грубый первый гейт (50 МБ: самый
      # крупный файл - таблица каталога организатора,
      # таблица каталога). НЕ зависит от лимита вложений UPLOAD_MAX_BYTES:
      # точные лимиты по назначению (вложения 10 МБ, каталог 50 МБ)
      # проверяет сервисный слой -> 413.
      max-file-size: ${SERVLET_MAX_FILE_SIZE:50MB}
      max-request-size: ${SERVLET_MAX_FILE_SIZE:52MB}

# --- HTTP ---------------------------------------------------------------
server:
  port: 8080

# --- Настройки приложения (JWT, хранилище вложений) ----------------------
# Секрет ТОЛЬКО через переменную окружения JWT_SECRET: пустой или короче
# 32 байт - приложение не стартует (fail-fast в JwtService), дефолта нет.
# Сгенерировать: openssl rand -base64 48
# upload.root - корень хранилища вложений:
# относительный по умолчанию (рабочий каталог приложения); в compose
# переопределяется абсолютным путём тома /app/data/attachments
# (AGENTS.md §10: без хардкода путей). max-bytes - лимит импорта (10 МБ
# с запасом достаточен для Excel/CSV с параметрами: 145 параметров, из
# них в шаблоне одного типа объекта максимум 59 колонок).
app:
  jwt:
    secret: ${JWT_SECRET:}
    ttl-hours: ${JWT_TTL_HOURS:24}
  upload:
    root: ${UPLOAD_ROOT:./data/attachments}
    max-bytes: ${UPLOAD_MAX_BYTES:10485760}
  admin-import:
    # Хранилище загруженных таблиц каталога:
    # data/admin-imports/{importId}.{ext} - копия для refresh
    root: ${ADMIN_IMPORT_ROOT:./data/admin-imports}
    # Лимит файла каталога - 50 МБ (больше - 413)
    max-bytes: ${ADMIN_IMPORT_MAX_BYTES:52428800}
  simulation:
    # Хранилище сохранённых 2D-схем имитации
    root: ${SIM_ROOT:./data/simulations}
  export:
    # Хранилище сгенерированных отчётов:
    # PDF/XLSX/CSV в data/exports/{projectId}/{exportId}.{ext}; удаление
    # каталога - вместе с проектом. max-bytes - лимит отчёта
    # (50 МБ с многократным запасом; защита от аномалий, не регулирование).
    root: ${EXPORT_ROOT:./data/exports}
    max-bytes: ${EXPORT_MAX_BYTES:52428800}

# --- springdoc-openapi (Swagger UI / спецификация) ----------------------
springdoc:
  api-docs:
    path: /v3/api-docs          # JSON-спецификация OpenAPI
  swagger-ui:
    path: /swagger-ui.html      # UI: /swagger-ui.html (redirect на /swagger-ui/index.html)
    operationsSorter: method    # GET сверху - привычный порядок чтения

# Уровни логов. SQL Hibernate выключен по умолчанию (шум и I/O-нагрузка
# при 50 пользователях); для отладки включить debug
# через переменную окружения SQL_LOG_LEVEL=debug.
logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:info}
    org.flywaydb: info
